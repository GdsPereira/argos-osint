<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="argosBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Cybernetic Gradient -->
    <linearGradient id="argosCyanIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Radar Glow Filter -->
    <radialGradient id="pupilGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </radialGradient>
  </defs>

  <!-- Base Rounded Container (Squircle) -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#argosBg)" stroke="url(#argosCyanIndigo)" stroke-width="1.8" />

  <!-- Subtle Inner Target Rings -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="3 3" />
  <circle cx="32" cy="32" r="16" fill="none" stroke="#6366f1" stroke-opacity="0.25" stroke-width="1" />

  <!-- Cardinal Crosshair Target Ticks -->
  <line x1="32" y1="5" x2="32" y2="10" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="54" x2="32" y2="59" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="5" y1="32" x2="10" y2="32" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="54" y1="32" x2="59" y2="32" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

  <!-- Argos All-Seeing Eye Outer Shape (Panoptes Eye) -->
  <path d="M 10 32 C 17 19, 47 19, 54 32 C 47 45, 17 45, 10 32 Z" 
        fill="#0b1120" 
        fill-opacity="0.75"
        stroke="url(#argosCyanIndigo)" 
        stroke-width="3" 
        stroke-linejoin="round" />

  <!-- Iris Circle -->
  <circle cx="32" cy="32" r="8.5" fill="#070d1d" stroke="#38bdf8" stroke-width="2.2" />

  <!-- Pupil (Glowing Core) -->
  <circle cx="32" cy="32" r="4.2" fill="url(#pupilGlow)" />
  <circle cx="34" cy="30" r="1.3" fill="#ffffff" />
</svg>
