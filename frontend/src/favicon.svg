<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="igGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fcb045" />
      <stop offset="30%" stop-color="#fd1d1d" />
      <stop offset="65%" stop-color="#e1306c" />
      <stop offset="100%" stop-color="#833ab4" />
    </linearGradient>
  </defs>
  <!-- Background Squircle with Instagram Brand Gradient -->
  <rect width="32" height="32" rx="7.5" fill="url(#igGradient)" />
  <!-- Inner Subtle Glow Rim -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.75" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="0.75" />
  <!-- Camera Body -->
  <rect x="6.5" y="6.5" width="19" height="19" rx="5" fill="none" stroke="#ffffff" stroke-width="2.2" />
  <!-- Camera Lens -->
  <circle cx="16" cy="16" r="4.25" fill="none" stroke="#ffffff" stroke-width="2.2" />
  <!-- Flash Dot -->
  <circle cx="21.5" cy="10.5" r="1.3" fill="#ffffff" />
</svg>
