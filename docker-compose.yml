services:
  # ========================================================
  # Banco de Dados Relacional Resiliente (PostgreSQL 16)
  # ========================================================
  postgres:
    image: postgres:16-alpine
    container_name: argos_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5456}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-argos_db}
      POSTGRES_USER: ${POSTGRES_USER:-argos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-argos_pass_2026}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - argos_postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-argos_user} -d ${POSTGRES_DB:-argos_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - argos_network

  # ========================================================
  # Serviço Backend Argos OSINT (FastAPI + Python 3.12)
  # ========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: argos_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-argos_user}:${POSTGRES_PASSWORD:-argos_pass_2026}@postgres:5432/${POSTGRES_DB:-argos_db}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-argos_db}
      - POSTGRES_USER=${POSTGRES_USER:-argos_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-argos_pass_2026}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-}
      - AI_MODEL=${AI_MODEL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - APIFY_TOKEN=${APIFY_TOKEN:-}
      - IG_TOKEN=${IG_TOKEN:-}
      - FB_TOKEN=${FB_TOKEN:-}
      - IG_USER_ID=${IG_USER_ID:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/config"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - argos_network

  # ========================================================
  # Serviço Frontend Argos OSINT (Angular 19 + Nginx)
  # ========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: argos_frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - argos_network

volumes:
  argos_postgres_data:
    driver: local

networks:
  argos_network:
    driver: bridge
